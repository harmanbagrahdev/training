<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Form</title>

    <style>
        .body{
            background-color: bisque;
        }

        form{
            display: flex;
            flex-direction: column;
            row-gap: 10px;
        }

        .name, .gender, .age{
            border: solid 1px black;
            height: 1rem;
            border-radius: 4px;
        }
    </style>
</head>
<body class="body">
    <form>
        <div class="first-name-container">
            <p>Enter first name: </p>
            <div>
                <input type="text" placeholder="Enter" class="name">
            </div>
        </div>
        <div class="last-name-container">
            <p>Enter last name: </p>
        <div>
            <div>
                <input type="text" placeholder="Enter" class="name">
            </div>
        </div>
        </div>
        <div class="gender-container">
            <p>Enter gender:</p>
            <div>
                <input type="text" placeholder="Enter" class="gender">
            </div>
        </div>
        <div class="age-container">
            <p>Enter age: </p>
            <div>
                <input type="text" placeholder="Enter" class="age">
            </div>
        <div class="email-container">
            <p>Enter email: </p>
            <div>
                <input type="text" placeholder="Enter" class="age">
            </div>
        <div class="purpose-container">
            <p>Enter Purpose: </p>
            <div>
                <input type="text" placeholder="Enter" class="age">
            </div>
        </div>
    </form>
</body>
</html>
